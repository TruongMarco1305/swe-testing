[pytest]
# Allow pytest to discover files named TC-XXX_code.py / TC-XXX.py / TC-ALL.py
# in addition to the conventional test_*.py pattern.
python_files = TC-*.py test_*.py
python_classes = Test*
python_functions = test_*
# importlib mode is required because the new filenames contain hyphens
# (TC-001, TC-ALL) which are not valid Python module identifiers under
# the default "prepend" import mode.
addopts = --import-mode=importlib
